- id: CPL-35
  law: 中华人民共和国民事诉讼法
  article: 第三十五条
  title: 协议管辖
  text: |-
    合同或者其他财产权益纠纷的当事人可以书面协议选择被告住所地、合同履行地、合同签订地、原告住所地、标的物所在地等与争议有实际联系的地点的人民法院管辖，但不得违反本法对级别管辖和专属管辖的规定。
  effective_date: '2024-01-01'
  source_url: https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=98636
  tags:
  - dispute
  - jurisdiction
  - agreement_jurisdiction
