# 作者构造的检索评测集：query -> 相关法条 ID。
# 来源混合 Playbook 场景与合同条款改写；不是独立法务标注，不能代表大样本泛化。
- id: q01
  query: 合同生效后5个工作日内支付合同总价50%的预付款
  relevant: [CC-509, CC-577, CC-626]
  category: payment
  source: synthetic_clause
  notes: 预付款比例过高；对应 PAY-001
- id: q02
  query: 甲方应在验收或收货前一次性支付全部合同价款
  relevant: [CC-620, CC-621, CC-626]
  category: payment
  source: synthetic_clause
  notes: 验收/交付前支付全款；对应 PAY-002
- id: q03
  query: 合同未约定付款期限，或付款期限为验收后90日
