services:
  contractguard:
    build:
      context: .
    image: contractguard:local
    ports:
      # Keep the demo bound to localhost. Do not expose it publicly without auth.
      # Override with CONTRACTGUARD_PORT=8001 if 8000 is already in use.
      - "127.0.0.1:${CONTRACTGUARD_PORT:-8000}:8000"
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      HITL_ENABLED: ${HITL_ENABLED:-1}
      HITL_RESUME_ON_STARTUP: ${HITL_RESUME_ON_STARTUP:-1}
      WORKER_ENABLED: ${WORKER_ENABLED:-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      CONTRACTGUARD_DB_PATH: /app/data/jobs.sqlite3
      CONTRACTGUARD_CHECKPOINT_DB_PATH: /app/data/checkpoints.sqlite3
      CONTRACTGUARD_UPLOAD_DIR: /app/data/uploads
      # Optional single-tenant token (empty disables auth):
      CONTRACTGUARD_API_TOKEN: ${CONTRACTGUARD_API_TOKEN:-}
      # Set to 1 for LAN/multi-machine access; requires API token.
      CONTRACTGUARD_REQUIRE_AUTH: ${CONTRACTGUARD_REQUIRE_AUTH:-0}
      CONTRACTGUARD_ALLOWED_HOSTS: ${CONTRACTGUARD_ALLOWED_HOSTS:-}
      MAX_ACTIVE_JOBS: ${MAX_ACTIVE_JOBS:-20}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-2000000}
      MAX_CLAUSES: ${MAX_CLAUSES:-1000}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-50000000}
      MAX_JSON_BODY_MB: ${MAX_JSON_BODY_MB:-2}
      JOB_DEADLINE_S: ${JOB_DEADLINE_S:-900}
      DOCX_MAX_ENTRIES: ${DOCX_MAX_ENTRIES:-2000}
      DOCX_MAX_XML_MB: ${DOCX_MAX_XML_MB:-50}
      # Optional live mode:
      # DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # RERANK_ENABLED: ${RERANK_ENABLED:-0}
      # Optional at-rest encryption (state_json + checkpoints):
      # ENCRYPTION_ENABLED: "1"
      # CONTRACTGUARD_MASTER_KEY: ${CONTRACTGUARD_MASTER_KEY:-}
    volumes:
      # Keep the task SQLite outside the container so `docker-compose down/up`
      # does not lose completed reviews. `down -v` still deletes it.
      - contractguard-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  contractguard-data:

