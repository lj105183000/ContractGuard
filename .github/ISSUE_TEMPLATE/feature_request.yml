name: 功能建议
description: 提议新的审查能力、工程改进或文档补充
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ContractGuard 只做**中文货物采购合同**，不追求通用合同助手。
        提案请尽量说明它如何服务这个范围，以及是否需要同步修改规则、法条、评测标签或文档。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？现有流程为什么不够？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述期望的行为、接口或界面，不必是最终实现。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 审查规则 / Playbook
        - 法条知识库 / RAG
        - Agent 编排 / HITL
        - API / 数据持久化
        - 前端界面
        - Electron 桌面端
        - 评测 / 标注
        - 文档 / 部署
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍
      description: 考虑过哪些做法？是否接受更小的 MVP 版本？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关 Issue、论文、截图或合成示例。不要包含真实合同或个人信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 与 Roadmap，未找到重复项。
          required: true
        - label: 我理解本项目不提供法律意见，示例数据需为合成数据。
          required: true
