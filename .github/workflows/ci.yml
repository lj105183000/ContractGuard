name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and eval gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests with coverage gate
        run: uv run pytest -q --cov=app --cov-report=term --cov-fail-under=80
      - name: Audit Python dependencies
        run: >-
          uv run --with pip-audit pip-audit --progress-spinner off
          --vulnerability-service osv --timeout 30
      - name: Live-mode offline fallback smoke
        run: uv run python scripts/test_live_offline.py
      - name: Validate knowledge base
        run: uv run python scripts/validate_kb.py
      - name: Validate evaluation assets
        run: uv run python scripts/validate_eval_assets.py
      - name: Rules baseline evaluation gate
        run: >-
          uv run python eval/run_eval.py --mode rules
          --min-precision 0.99 --min-recall 0.93 --min-f1 0.96
      - name: Retrieval evaluation gate (offline BM25 baseline)
        run: >-
          uv run python eval/run_retrieval_eval.py --no-rerank
          --threshold-config bm25 --min-recall-at-10 0.45 --min-ndcg-at-10 0.35
      - name: Perturbation stability gate
        run: >-
          uv run python eval/run_perturbation_eval.py
          --min-baseline-f1 0.95 --max-f1-drop-pp 5
      - name: Cost/latency gate from saved full results
        run: >-
          uv run python eval/run_cost_report.py
          --max-cost-cny 1.0 --max-p95-s 120
          --max-failed-calls 10 --max-rate-limited-calls 10
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports
          path: |
            backend/eval/report_rules.md
            backend/eval/results_rules.json
            backend/eval/report_retrieval.md
            backend/eval/report_perturbation.md
            backend/eval/report_cost.md

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Diff utility checks
        run: npm run test:diff
      - name: Error guidance checks
        run: node scripts/check_error_guidance.mjs

  e2e:
    name: Frontend browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright
        working-directory: desktop
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser E2E (review + delete)
        working-directory: backend
        run: |
          mkdir -p /tmp/contractguard-e2e
          export LLM_MODE=mock SYNC_JOBS=1 HITL_ENABLED=0 WORKER_ENABLED=0
          export CONTRACTGUARD_DB_PATH=/tmp/contractguard-e2e/jobs.sqlite3
          export CONTRACTGUARD_CHECKPOINT_DB_PATH=/tmp/contractguard-e2e/checkpoints.sqlite3
          export CONTRACTGUARD_UPLOAD_DIR=/tmp/contractguard-e2e/uploads
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/contractguard-e2e/server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 1
          done
          cd ../desktop
          node scripts/web-smoke.mjs
      - name: Server logs on failure
        if: failure()
        run: tail -100 /tmp/contractguard-e2e/server.log

  docker:
    name: Docker build and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t contractguard:ci .
      - name: Start container
        run: >-
          docker run -d --name contractguard-ci --publish 8010:8000
          -e LLM_MODE=mock -e HITL_ENABLED=1 -e WORKER_ENABLED=1
          contractguard:ci
      - name: HTTP smoke (upload, review, HITL, report)
        run: >-
          docker exec contractguard-ci
          /app/backend/.venv/bin/python /app/backend/scripts/smoke_http.py
          --base-url http://127.0.0.1:8000
      - name: Container logs on failure
        if: failure()
        run: docker logs contractguard-ci
      - name: Remove container
        if: always()
        run: docker rm -f contractguard-ci

  desktop:
    name: Windows desktop package smoke
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install desktop dependencies
        run: npm ci
      - name: Audit desktop dependencies
        run: npm audit --audit-level=high
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: Build unpacked desktop app
        run: npm run pack:dir
      - name: Smoke packaged app
        shell: pwsh
        env:
          CONTRACTGUARD_REQUIRE_HISTORY_ENCRYPTION: "1"
        run: |
          $env:CONTRACTGUARD_SMOKE_EXE = "release/win-unpacked/ContractGuard.exe"
          node scripts/smoke.mjs
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke
          path: desktop/.smoke/**/*.png

  docs:
    name: Docs link check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check relative links in Markdown and HTML
        run: python scripts/check_docs_links.py
